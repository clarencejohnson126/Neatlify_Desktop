<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Neatlify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --jungle-green: #29AB87;
      --coral: #FF6B6B;
      --golden-yellow: #FFD93D;
      --off-white: #FAFAF8;
      --charcoal: #2D3436;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--off-white);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: white;
      border: 3px solid var(--charcoal);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 48px;
      text-align: center;
      box-shadow: 4px 4px 0px 0px var(--charcoal);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: var(--jungle-green);
      border: 3px solid var(--charcoal);
      border-radius: 50%;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0px 0px var(--charcoal);
    }
    .icon span {
      color: white;
      font-size: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 18px;
      color: var(--charcoal);
      opacity: 0.7;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--jungle-green);
      border-top-color: transparent;
      border-radius: 50%;
      margin: 0 auto 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .fallback {
      text-align: left;
      background: var(--off-white);
      border: 2px dashed var(--charcoal);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .fallback h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .fallback ul {
      list-style: none;
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
    }
    .fallback li {
      margin-bottom: 8px;
    }
    .session-box {
      background: white;
      border: 2px solid var(--golden-yellow);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .copy-btn {
      width: 100%;
      background: var(--golden-yellow);
      border: 3px solid var(--charcoal);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      box-shadow: 4px 4px 0px 0px var(--charcoal);
      transform: translate(-2px, -2px);
    }
    .copy-btn.copied {
      background: var(--jungle-green);
      color: white;
    }
    .back-link {
      color: var(--jungle-green);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }
    .open-app-btn {
      display: inline-block;
      background: var(--jungle-green);
      color: white;
      border: 3px solid var(--charcoal);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 16px 32px;
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 24px;
      transition: all 0.2s;
    }
    .open-app-btn:hover {
      box-shadow: 6px 6px 0px 0px var(--charcoal);
      transform: translate(-2px, -2px);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <span>✓</span>
    </div>

    <h1 id="title">Payment Successful!</h1>
    <p class="subtitle" id="subtitle">Opening Neatlify...</p>

    <div class="spinner" id="spinner"></div>

    <a href="#" id="openAppBtn" class="open-app-btn hidden">Open Neatlify App</a>

    <div class="fallback" id="fallback" style="display: none;">
      <h2 id="instructionsTitle">If the app didn't open automatically:</h2>
      <ul>
        <li>1. Open Neatlify</li>
        <li>2. Go to Settings → Subscription</li>
        <li>3. Click 'Verify Payment'</li>
        <li>4. Paste this code:</li>
      </ul>

      <div class="session-box" id="sessionId">-</div>
      <button class="copy-btn" id="copyBtn" onclick="copySessionId()">Copy Session ID</button>
    </div>

    <a href="/" class="back-link">Back to Home</a>
  </div>

  <script>
    // Get session_id from URL
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id') || '';

    // Display session ID
    document.getElementById('sessionId').textContent = sessionId || 'No session ID found';

    // Build the app URL
    const appUrl = sessionId ? `neatlify://activate?session_id=${sessionId}` : null;

    // Set up the open app button
    const openAppBtn = document.getElementById('openAppBtn');
    if (appUrl) {
      openAppBtn.href = appUrl;
    }

    // Try to open the app automatically
    if (appUrl) {
      // Small delay to let the page render first
      setTimeout(() => {
        window.location.href = appUrl;
      }, 500);

      // Show fallback after 2 seconds if redirect didn't work
      setTimeout(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('subtitle').textContent = 'Click below to open the app';
        document.getElementById('openAppBtn').classList.remove('hidden');
        document.getElementById('fallback').style.display = 'block';
      }, 2000);
    } else {
      // No session ID - show error state
      document.getElementById('title').textContent = 'Something went wrong';
      document.getElementById('subtitle').textContent = 'No payment session found';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
      document.getElementById('instructionsTitle').textContent = 'Please try again or contact support';
    }

    // Copy to clipboard function
    function copySessionId() {
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(sessionId).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy Session ID';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Detect language from localStorage or browser
    const savedLang = localStorage.getItem('neatlify_lang');
    const browserLang = navigator.language.startsWith('de') ? 'DE' : 'EN';
    const lang = savedLang || browserLang;

    if (lang === 'DE') {
      document.getElementById('title').textContent = 'Zahlung erfolgreich!';
      document.getElementById('subtitle').textContent = 'Neatlify wird geöffnet...';
      document.getElementById('instructionsTitle').textContent = 'Falls die App nicht automatisch startet:';
      document.getElementById('copyBtn').textContent = 'Session ID kopieren';
      document.querySelector('.back-link').textContent = 'Zurück zur Startseite';
      document.getElementById('openAppBtn').textContent = 'Neatlify App öffnen';
    }
  </script>
</body>
</html>
