
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neatlify - Organize Your Files with AI</title>
  <meta name="description" content="Neatlify uses AI to understand your files and organize them perfectly on your Mac.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --jungle-green: #29AB87;
      --coral: #FF6B6B;
      --golden-yellow: #FFD93D;
      --off-white: #FAFAF8;
      --charcoal: #2D3436;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--off-white);
      color: var(--charcoal);
      overflow-x: hidden;
    }
    .sketch-border {
      border: 3px solid var(--charcoal);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    }
    .paper-texture {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }
    .cartoon-shadow {
      box-shadow: 4px 4px 0px 0px var(--charcoal);
    }
    .cartoon-shadow-hover:hover {
      box-shadow: 6px 6px 0px 0px var(--charcoal);
      transform: translate(-2px, -2px);
    }
    .wiggle {
      animation: wiggle 3s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.5deg); }
    }
    .float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .transition-all {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html {
      scroll-behavior: smooth;
    }
    /* Rough handwritten underline */
    .rough-underline {
      position: relative;
    }
    .rough-underline::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 8px;
      background: var(--golden-yellow);
      z-index: -1;
      border-radius: 50% 10% 40% 5%;
      opacity: 0.6;
    }

    /* Scroll animations */
    .fade-in-up {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }
    .fade-in-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-in-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }
    .fade-in-left.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .fade-in-right {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }
    .fade-in-right.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .scale-in {
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .scale-in.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Stagger delay classes */
    .delay-100 { transition-delay: 100ms; }
    .delay-200 { transition-delay: 200ms; }
    .delay-300 { transition-delay: 300ms; }
    .delay-400 { transition-delay: 400ms; }
    .delay-500 { transition-delay: 500ms; }

    /* Flip card */
    .flip-card {
      perspective: 1000px;
      cursor: pointer;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Pulse animation */
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Bounce animation */
    .bounce {
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* Shake animation on hover */
    .shake-hover:hover {
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-1deg); }
      75% { transform: translateX(5px) rotate(1deg); }
    }

    /* Glow effect */
    .glow {
      box-shadow: 0 0 20px rgba(41, 171, 135, 0.3);
    }
    .glow-hover:hover {
      box-shadow: 0 0 30px rgba(41, 171, 135, 0.5);
    }

    /* Text gradient animation */
    .text-gradient {
      background: linear-gradient(90deg, var(--jungle-green), var(--coral), var(--golden-yellow), var(--jungle-green));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 8s ease infinite;
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Counter animation */
    .count-up {
      font-variant-numeric: tabular-nums;
    }

    /* Card overflow fix */
    .card-content {
      overflow: hidden;
      word-wrap: break-word;
      hyphens: auto;
    }

    /* Typewriter effect */
    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      animation: typing 3s steps(40, end);
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Marquee */
    .marquee {
      overflow: hidden;
    }
    .marquee-content {
      display: flex;
      animation: marquee 30s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
